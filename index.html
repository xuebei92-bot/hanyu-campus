<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8d2730"><title>Hanyu Campus · 线下国际中文课堂</title>
<style>
:root{--red:#8d2730;--red2:#a83b45;--ink:#292624;--muted:#756f6a;--paper:#fffaf4;--panel:#fffdf9;--line:#eadfd5;--green:#39735d;--gold:#b78a54}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 10%,#f2dccc 0,transparent 35%),var(--paper)}.auth-card{width:min(100%,470px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:36px;box-shadow:0 16px 45px #52251b0b}.brand{display:flex;align-items:center;gap:10px;color:var(--red);font-size:20px;font-weight:700}.mark{width:34px;height:34px;border-radius:10px;background:var(--red);color:#fffaf4;display:grid;place-items:center}.eyebrow{font-size:12px;color:var(--red);font-weight:700;letter-spacing:.12em;text-transform:uppercase}.h1{font-size:34px;line-height:1.15;margin:8px 0}.sub,.meta{color:var(--muted)}.sub{margin:0 0 20px}.form{display:grid;gap:14px}.form label{display:grid;gap:6px;font-weight:700}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:white}.field:focus{outline:3px solid #8d273033;border-color:var(--red)}.btn{border:0;border-radius:9px;padding:11px 17px;background:var(--red);color:#fff;font-weight:700}.btn:hover{background:var(--red2)}.btn.alt{background:#f1e4d8;color:var(--red)}.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--line)}.tip{font-size:14px;color:var(--muted);border-left:3px solid var(--gold);padding-left:12px}.shell{min-height:100vh;display:flex}.rail{width:240px;background:#f4e8dd;border-right:1px solid var(--line);padding:25px 18px;display:flex;flex-direction:column}.nav{display:grid;gap:5px;margin-top:26px}.nav button{text-align:left;padding:11px 13px;background:transparent;border:0;border-radius:10px;color:#635b55;font-weight:700}.nav button.active,.nav button:hover{background:#fff8f0;color:var(--red)}.user{margin-top:auto;border-top:1px solid var(--line);padding-top:18px;display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:#ead0bc;color:var(--red);font-weight:700;overflow:hidden;vertical-align:middle}.avatar img{width:100%;height:100%;object-fit:cover}.main{flex:1;padding:30px 5%;max-width:1450px}.top{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:25px}.grid{display:grid;gap:18px}.two{grid-template-columns:1.5fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:0 16px 45px #52251b0b}.card h2,.card h3{margin:0 0 12px}.hero{background:var(--red);color:#fff7ef}.hero .sub,.hero .meta{color:#f5d9d3}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#f3e7dd;color:var(--red);font-size:13px;font-weight:700}.hero .pill{background:#ffffff22;color:#fff}.time{font-size:42px;font-weight:700;margin:16px 0 2px}.metric{font-size:30px;font-weight:700}.bar{height:8px;border-radius:8px;background:#eee3da;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);border-radius:8px}.list{display:grid}.item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.item:last-child{border-bottom:0}.status{color:var(--green);font-size:13px;font-weight:700}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}.table th{color:var(--muted);font-weight:500}.code{font-size:30px;letter-spacing:.12em;color:var(--red);font-weight:700;text-align:center;padding:12px;background:#fff3e9;border-radius:12px}.qr{width:min(100%,280px);aspect-ratio:1;display:block;margin:12px auto;background:#fff;border:10px solid #fff;border-radius:4px}.qr-help{text-align:center;color:var(--muted);font-size:14px}.question{border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;background:#fffdfa}.question h3{font-size:17px}.option{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin:7px 0;font-weight:400;background:#fff}.option:hover{border-color:var(--red)}.editor-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:13px 18px;border-radius:10px;z-index:10}.danger{color:#a22b34}.small{font-size:13px}@media(max-width:800px){.shell{display:block}.rail{width:100%;padding:12px 14px;display:block;position:sticky;top:0;z-index:2}.rail .brand{padding:3px 4px 10px}.nav{display:flex;overflow:auto;margin-top:0}.nav button{white-space:nowrap;padding:8px 10px;font-size:14px}.user{display:none}.main{padding:22px 16px 70px}.top{margin-bottom:18px}.top .btn{display:none}.h1{font-size:28px}.two,.three{grid-template-columns:1fr}.card{padding:17px}.time{font-size:36px}.auth-card{padding:25px 20px}.table{display:block;overflow:auto;white-space:nowrap}.editor-actions .btn{flex:1}.qr{width:min(100%,240px)}}
</style></head>
<body><div id="app"><main class="auth"><section class="auth-card"><div class="brand"><span class="mark">汉</span> Hanyu Campus</div><div class="eyebrow" style="margin-top:25px">In-person Chinese learning</div><h1 class="h1">Welcome back</h1><p class="sub">正在加载课堂平台…</p><p class="tip">如果页面长时间停留，请刷新一次。</p></section></main></div>
<script>
const demo={students:[{id:'anna',name:'Anna Petrova',initial:'A',language:'俄语'},{id:'leo',name:'Leo Martin',initial:'L',language:'法语'},{id:'maria',name:'Maria Santos',initial:'M',language:'西班牙语'}],assignments:[{id:1,title:'我的中文名',due:'2026-09-18',state:'已发布',questions:[{type:'choice',prompt:'“你叫什么名字？”是什么意思？',options:['What is your name?','Where are you from?','How old are you?'],answer:0,points:5},{type:'fill',prompt:'请填空：我____Anna。',answer:'叫',points:5},{type:'tf',prompt:'“名字”是 name 的意思。',answer:'true',points:5}]}],materials:['HSK 1 · 第三课：你叫什么名字？','课堂词汇音频与练习说明'],submissions:{},attendance:{}};
let data=load('hanyu-data',demo);if(!data||!Array.isArray(data.students)||!Array.isArray(data.assignments))data=demo;let user=load('hanyu-user',null),page='home',draft=null,attSession=null,attTimer=null,pendingCheckin=new URLSearchParams(location.search).get('checkin');
function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch(e){return f}}function store(){localStorage.setItem('hanyu-data',JSON.stringify(data))}function saveUser(){localStorage.setItem('hanyu-user',JSON.stringify(user))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function notify(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)}function go(p){page=p;render()}function logout(){user=null;localStorage.removeItem('hanyu-user');page='home';render()}function avatar(x){return x&&x.startsWith('data:')?'<span class="avatar"><img src="'+x+'"></span>':'<span class="avatar">'+esc(x||'?')+'</span>'}function head(a,b,c){return '<div class="top"><div><div class="eyebrow">'+a+'</div><h1 class="h1">'+b+'</h1><p class="sub">'+(c||'')+'</p></div></div>'}
function qrUrl(token){let target=location.origin+location.pathname+'?checkin='+encodeURIComponent(token);return 'https://quickchart.io/qr?text='+encodeURIComponent(target)+'&size=500&margin=2'}function token(){return Math.random().toString(36).slice(2,8).toUpperCase()}function left(t){let n=Math.max(0,t-Date.now()),m=Math.floor(n/60000),s=Math.floor(n/1000)%60;return m+':'+String(s).padStart(2,'0')}
function startAtt(){if(attTimer)clearInterval(attTimer);attSession={token:token(),expires:Date.now()+5*60*1000,refresh:Date.now()};page='attendance';render();attTimer=setInterval(()=>{if(!attSession)return;if(Date.now()>=attSession.expires){clearInterval(attTimer);attTimer=null;attSession=null;notify('签到已结束');page='home';render();return}if(Date.now()-attSession.refresh>=15000){attSession.token=token();attSession.refresh=Date.now();render()}else{let el=document.getElementById('countdown');if(el)el.textContent=left(attSession.expires)}},1000)}function stopAtt(){if(attTimer)clearInterval(attTimer);attTimer=null;attSession=null;page='home';render();notify('签到已结束')}
function handleCheckin(){if(!pendingCheckin||!user||user.role!=='student')return;data.attendance[user.id]={time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),token:pendingCheckin};store();pendingCheckin=null;history.replaceState({},'',location.pathname);notify('签到成功，已记录到本设备')}
function render(){if(!user){document.getElementById('app').innerHTML='<main class="auth"><section class="auth-card"><div class="brand"><span class="mark">汉</span> Hanyu Campus</div><div class="eyebrow" style="margin-top:25px">In-person Chinese learning</div><h1 class="h1">Welcome back</h1><p class="sub">Sign in to your in-person class.</p><form id="login" class="form"><label>Username<input id="name" class="field" placeholder="anna or teacher" required></label><label>Password<input id="pass" class="field" type="password" placeholder="hanyu123" required></label><button class="btn">Sign in</button></form><p class="tip" style="margin-top:20px">演示账号：anna / teacher<br>密码：hanyu123</p></section></main>';document.getElementById('login').onsubmit=e=>{e.preventDefault();let n=document.getElementById('name').value.trim().toLowerCase();if(n!=='anna'&&n!=='teacher')return notify('请输入 anna 或 teacher');user={role:n==='teacher'?'teacher':'student',id:n};saveUser();handleCheckin();render()};return}handleCheckin();document.getElementById('app').innerHTML='<div class="shell">'+sidebar()+'<main class="main">'+(user.role==='student'?student():teacher())+'<p class="meta" style="margin-top:32px">Hanyu Campus <button class="btn alt" style="float:right" onclick="logout()">退出登录</button></p></main></div>'}
function sidebar(){let s=user.role==='student'?[['home','Home'],['book','Textbook'],['hw','Homework'],['practice','Practice'],['grades','Grades / Profile']]:[['home','今日课程'],['students','学生管理'],['hw','作业管理'],['materials','教材/资料'],['activity','课堂活动'],['grades','成绩统计'],['settings','系统设置']];return '<aside class="rail"><div class="brand"><span class="mark">汉</span> Hanyu Campus</div><nav class="nav">'+s.map(x=>'<button class="'+(page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</nav><div class="user">'+avatar(user.role==='student'?'A':'教')+'<span><b>'+(user.role==='student'?'Anna Petrova':'林老师')+'</b><br><small>'+(user.role==='student'?'HSK 1–2':'教师端')+'</small></span></div></aside>'}
function student(){if(page==='book')return book();if(page==='hw')return studentHw();if(page==='taking')return takeAssignment();if(page==='practice')return practice();if(page==='grades')return studentGrades();let a=data.attendance[user.id];return head('Wednesday · 16 September 2026','Good afternoon, Anna.','Your next in-person class is ready.')+'<div class="grid two"><section class="card hero"><span class="pill">Today’s Class · 第 6 次课</span><div class="time">14:00 — 17:20</div><div class="meta">Room B-204 · Chinese Foundations</div><p>签到开放后，用手机扫描教室投影上的动态二维码。</p><button class="btn alt" onclick="scanDemo()">'+(a?'已签到 · 查看记录':'Scan to check in →')+'</button></section><section class="card"><div class="item"><h3>Attendance</h3><span class="status">'+(a?'Present':'暂无记录')+'</span></div><div class="metric">'+(a?'100%':'—')+'</div><div class="bar"><i style="width:'+(a?'100':'0')+'%"></i></div><p class="meta">'+(a?'签到时间 '+a.time:'完成签到后，这里会显示你的实际出勤率。')+'</p><hr style="border:0;border-top:1px solid var(--line)"><h3>Today’s focus</h3><p>Introducing yourself · names · countries</p></section></div><div class="grid three" style="margin-top:18px"><section class="card"><span class="pill">Homework</span><h3>我的中文名</h3><p class="meta">Due Friday · '+data.assignments[0].questions.length+' questions</p><button class="btn alt" onclick="go(\'hw\')">Continue →</button></section><section class="card"><span class="pill">Practice</span><h3>Numbers 1–20</h3><p class="meta">8 min recommended</p><button class="btn alt" onclick="go(\'practice\')">Start →</button></section><section class="card"><span class="pill">Progress</span><h3>Course average</h3><div class="metric">—</div><p class="meta">还没有足够数据</p></section></div>'}function scanDemo(){if(attSession){pendingCheckin=attSession.token;handleCheckin();render()}else notify('请让教师先开始签到，再扫描投影二维码')}
function book(){return head('Textbook · 第三课','你叫什么名字？','Vocabulary, dialogue and grammar for today.')+'<section class="card"><h3>词汇</h3><div class="list">'+[['叫','jiào','to be called'],['什么','shénme','what'],['名字','míngzi','name'],['认识','rènshi','to know / meet']].map(x=>'<div class="item"><b>'+x[0]+' <span class="meta">'+x[1]+'</span></b><span class="meta">'+x[2]+'</span></div>').join('')+'</div><h3 style="margin-top:20px">课文</h3><p>你好！你叫什么名字？我叫 Anna。很高兴认识你。</p><h3>语法</h3><p class="meta">“叫 + 名字”用于介绍自己的名字。</p></section>'}
function studentHw(){return head('Homework','我的作业','完成教师发布的题目，提交后立即看到分数。')+'<section class="card"><div class="list">'+data.assignments.filter(a=>a.state==='已发布').map(a=>{let sub=data.submissions[user.id+'-'+a.id];return '<div class="item"><span><b>'+esc(a.title)+'</b><br><span class="meta">'+a.questions.length+' questions · Due '+a.due+'</span></span><span>'+(sub?'<span class="status">'+sub.score+'/'+sub.total+'</span> ':'')+'<button class="btn" onclick="openAssignment('+a.id+')">'+(sub?'查看':'开始')+'</button></span></div>'}).join('')+'</div></section>'}function openAssignment(id){draft=data.assignments.find(a=>a.id===id);page='taking';render()}
function takeAssignment(){let a=draft;if(!a)return studentHw();let sub=data.submissions[user.id+'-'+a.id];if(sub)return head('Homework result',a.title,'已自动评分')+'<section class="card"><div class="metric">'+sub.score+' / '+sub.total+'</div><p class="status">'+(sub.score===sub.total?'全部正确':'请复习下面的错题')+'</p>'+(sub.wrong.length?'<h3>错题</h3>'+sub.wrong.map(w=>'<div class="question"><b>'+esc(w.prompt)+'</b><p class="danger">你的答案：'+esc(w.given||'未作答')+'<br>正确答案：'+esc(w.correct)+'</p></div>').join(''):'')+'<button class="btn alt" onclick="go(\'hw\')">返回作业</button></section>';return head('Homework','作业：'+esc(a.title),'提交后系统自动评分。')+'<form id="take" class="card">'+a.questions.map((q,i)=>questionInput(q,i)).join('')+'<button class="btn" type="submit">提交并查看分数</button></form>'}function questionInput(q,i){if(q.type==='choice')return '<div class="question"><h3>'+(i+1)+'. '+esc(q.prompt)+'</h3>'+q.options.map((o,j)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+j+'" required> '+esc(o)+'</label>').join('')+'</div>';if(q.type==='tf')return '<div class="question"><h3>'+(i+1)+'. '+esc(q.prompt)+'</h3><label class="option"><input type="radio" name="q'+i+'" value="true" required> 正确 True</label><label class="option"><input type="radio" name="q'+i+'" value="false"> 错误 False</label></div>';return '<div class="question"><h3>'+(i+1)+'. '+esc(q.prompt)+'</h3><input class="field" name="q'+i+'" placeholder="请输入答案" required></div>'}
function submitAssignment(e){e.preventDefault();let a=draft,fd=new FormData(e.target),score=0,total=0,wrong=[];a.questions.forEach((q,i)=>{let given=String(fd.get('q'+i)||'').trim(),ok=q.type==='choice'?Number(given)===Number(q.answer):given.toLowerCase()===String(q.answer).trim().toLowerCase();total+=Number(q.points||5);if(ok)score+=Number(q.points||5);else wrong.push({prompt:q.prompt,given,correct:q.type==='choice'?q.options[q.answer]:q.type==='tf'?(q.answer==='true'?'正确 True':'错误 False'):q.answer})});data.submissions[user.id+'-'+a.id]={score,total,wrong};store();render()}
function practice(){return head('Practice lab','Choose a quick activity','Short activities for in-person practice.')+'<div class="grid three">'+['Quiz · 词汇小测','Word Match · 词语配对','Sentence Order · 句子排序'].map(x=>'<section class="card"><h3>'+x+'</h3><p class="meta">课堂练习</p><button class="btn" onclick="notify(\'活动开始\')">Start →</button></section>').join('')+'</div>'}function studentGrades(){return head('Grades / Profile','Your progress','成绩会根据出勤、作业和课堂活动汇总。')+'<div class="grid two"><section class="card"><h3>Course average</h3><div class="metric">— / 100</div><p class="meta">还没有足够数据</p></section><section class="card"><h3>Your profile</h3><p>'+avatar('A')+'　<b>Anna Petrova</b></p><label class="btn alt">Upload avatar<input type="file" hidden onchange="changeAvatar(event)"></label></section></div>'}function changeAvatar(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{user.avatar=r.result;saveUser();render();notify('头像已更新')};r.readAsDataURL(f)}
function teacher(){if(page==='students')return students();if(page==='hw')return assignments();if(page==='assignment-editor')return assignmentEditor();if(page==='materials')return materials();if(page==='attendance')return attendance();if(page==='activity')return head('课堂活动','课堂活动控制','发布活动后，学生端会看到入口。')+'<div class="grid three">'+['Quiz · 自我介绍','Word Match · 国籍','Sentence Order · 句型'].map(x=>'<section class="card"><h3>'+x+'</h3><p class="meta">可计入课堂活动成绩</p><button class="btn" onclick="notify(\'活动已发布\')">发布活动</button></section>').join('')+'</div>';if(page==='grades')return grades();if(page==='settings')return head('系统设置','系统设置','课堂和账号设置')+'<section class="card form"><label>课程名称<input class="field" value="线下国际中文课堂"></label><label>签到刷新间隔<select class="field"><option>15 秒</option><option>10 秒</option></select></label><button class="btn" onclick="notify(\'设置已保存\')">保存设置</button></section>';return head('教师工作台 · 2026年9月16日','今日课程','中文基础 · HSK 1–2 混合班 · B-204')+'<div class="grid two"><section class="card hero"><span class="pill">第 6 次课 · 14:00—17:20</span><h2>自我介绍与国籍</h2><p class="sub">课堂流程：签到 → 词汇导入 → 对话练习 → Quiz</p><button class="btn alt" onclick="startAtt()">开始签到</button></section><section class="card"><h3>签到状态</h3><p class="tip">点击后出现真正的二维码，15 秒自动刷新，开放 5 分钟。</p><p class="status">'+(attSession?'签到进行中':'今日尚未开始')+'</p><div class="item">已签到 <b>'+Object.keys(data.attendance).length+' / '+data.students.length+'</b><button class="btn alt" onclick="go(\'students\')">手动调整</button></div></section></div>'}
function attendance(){if(!attSession)return teacher();return head('课堂签到','动态签到二维码','请把二维码投影给学生，二维码每 15 秒自动刷新。')+'<div class="grid two"><section class="card"><img class="qr" src="'+qrUrl(attSession.token)+'" alt="动态签到二维码"><div id="countdown" class="code">'+left(attSession.expires)+'</div><p class="qr-help">学生登录后，用手机相机扫描二维码<br>二维码内容：'+esc(attSession.token)+'</p><button class="btn alt" onclick="stopAtt()">结束签到</button></section><section class="card"><h3>签到说明</h3><p>当前轮次开放 5 分钟；二维码每 15 秒更新一次。每台设备本轮只能签到一个账号。</p><div class="list"><div class="item"><span>已签到</span><b>'+Object.keys(data.attendance).length+' / '+data.students.length+'</b></div>'+data.students.map(s=>'<div class="item"><span>'+esc(s.name)+'</span><span class="status">'+(data.attendance[s.id]?'已签到':'等待中')+'</span></div>').join('')+'</div></section></div>'}
function students(){return head('学生管理','学生名单','HSK 1–2 · 线下中文基础')+'<section class="card"><button class="btn" onclick="addStudent()">＋ 添加学生</button><table class="table"><thead><tr><th>学生</th><th>母语</th><th>出勤</th><th>操作</th></tr></thead><tbody>'+data.students.map(s=>'<tr><td>'+avatar(s.initial)+'　<b>'+esc(s.name)+'</b></td><td>'+esc(s.language)+'</td><td>'+(data.attendance[s.id]?'已签到':'未签到')+'</td><td><button class="btn alt" onclick="editStudent(\''+s.id+'\')">编辑</button> <button class="btn alt" onclick="toggleAttendance(\''+s.id+'\')">'+(data.attendance[s.id]?'改为缺勤':'手动签到')+'</button> <button class="btn alt" onclick="removeStudent(\''+s.id+'\')">删除</button></td></tr>').join('')+'</tbody></table></section>'}function addStudent(){let n=prompt('学生姓名');if(!n)return;data.students.push({id:'s'+Date.now(),name:n,initial:n[0].toUpperCase(),language:'未填写'});store();render();notify('学生已添加')}function editStudent(id){let s=data.students.find(x=>x.id===id),n=prompt('修改学生姓名',s.name);if(n){s.name=n;store();render()}}function removeStudent(id){if(confirm('确定删除这名学生吗？')){data.students=data.students.filter(x=>x.id!==id);store();render()}}function toggleAttendance(id){if(data.attendance[id])delete data.attendance[id];else data.attendance[id]={time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),manual:true};store();render();notify('签到状态已更新')}
function assignments(){return head('作业管理','作业管理','创建题目、设置答案，学生提交后自动评分。')+'<section class="card"><button class="btn" onclick="newAssignment()">＋ 新建作业</button><div class="list">'+data.assignments.map(a=>'<div class="item"><span><b>'+esc(a.title)+'</b><br><span class="meta">'+a.questions.length+' 题 · '+a.due+'</span></span><span><span class="pill">'+a.state+'</span> <button class="btn alt" onclick="editAssignment('+a.id+')">编辑</button></span></div>').join('')+'</div></section>'}function newAssignment(){draft={id:Date.now(),title:'',due:'2026-09-24',state:'草稿',questions:[{type:'choice',prompt:'',options:['','',''],answer:0,points:5}]};page='assignment-editor';render()}function editAssignment(id){draft=data.assignments.find(a=>a.id===id);page='assignment-editor';render()}
function assignmentEditor(){let a=draft;return head('作业管理','编辑作业','每道题都可以设置题型、选项、正确答案和分值。')+'<form id="assignmentForm" class="card"><label class="form"><span>作业标题</span><input class="field" name="title" value="'+esc(a.title)+'" placeholder="例如：第三课词汇练习" required></label><label class="form" style="margin-top:14px"><span>截止日期</span><input class="field" type="date" name="due" value="'+a.due+'" required></label><div id="questions">'+a.questions.map((q,i)=>questionEditor(q,i)).join('')+'</div><div class="editor-actions"><button type="button" class="btn alt" onclick="addQuestion()">＋ 添加题目</button><span><button type="button" class="btn ghost" onclick="go(\'hw\')">取消</button> <button type="submit" class="btn">保存并发布</button></span></div></form>'}function questionEditor(q,i){let opts=q.options||['','',''];return '<div class="question" data-q="'+i+'"><div class="item"><h3>第 '+(i+1)+' 题</h3><button type="button" class="btn alt" onclick="removeQuestion('+i+')">删除</button></div><label class="form"><span>题型</span><select class="field q-type" data-i="'+i+'" onchange="changeType('+i+',this.value)"><option value="choice" '+(q.type==='choice'?'selected':'')+'>选择题</option><option value="tf" '+(q.type==='tf'?'selected':'')+'>判断题</option><option value="fill" '+(q.type==='fill'?'selected':'')+'>填空题</option><option value="order" '+(q.type==='order'?'selected':'')+'>句子排序</option></select></label><label class="form"><span>题目</span><input class="field q-prompt" value="'+esc(q.prompt)+'" placeholder="请输入题目"></label>'+(q.type==='choice'?'<label class="form"><span>选项（每行一个）</span><textarea class="field q-options" rows="3">'+esc(opts.join('\n'))+'</textarea></label><label class="form"><span>正确选项</span><select class="field q-answer"><option value="0" '+(q.answer==0?'selected':'')+'>第 1 项</option><option value="1" '+(q.answer==1?'selected':'')+'>第 2 项</option><option value="2" '+(q.answer==2?'selected':'')+'>第 3 项</option></select></label>':q.type==='tf'?'<label class="form"><span>正确答案</span><select class="field q-answer"><option value="true" '+(q.answer==='true'?'selected':'')+'>正确</option><option value="false" '+(q.answer==='false'?'selected':'')+'>错误</option></select></label>':'<label class="form"><span>标准答案</span><input class="field q-answer" value="'+esc(q.answer||'')+'" placeholder="请输入标准答案"></label>')+'<label class="form"><span>分值</span><input class="field q-points" type="number" min="1" value="'+(q.points||5)+'"></label></div>'}function readEditor(){let a={id:draft.id,title:document.querySelector('[name=title]').value.trim(),due:document.querySelector('[name=due]').value,state:'已发布',questions:[]};document.querySelectorAll('.question[data-q]').forEach(el=>{let type=el.querySelector('.q-type').value,prompt=el.querySelector('.q-prompt').value.trim(),points=Number(el.querySelector('.q-points').value)||5,ans=el.querySelector('.q-answer').value,q={type,prompt,points,answer:ans};if(type==='choice'){q.options=el.querySelector('.q-options').value.split('\n').map(x=>x.trim()).filter(Boolean);if(q.options.length<2)q.options=['选项 A','选项 B'];q.answer=Number(ans)}a.questions.push(q)});return a}function saveAssignment(e){e.preventDefault();let a=readEditor();if(!a.title||!a.questions.length)return notify('请填写作业标题和至少一道题');let i=data.assignments.findIndex(x=>x.id===a.id);if(i>=0)data.assignments[i]=a;else data.assignments.unshift(a);store();draft=null;page='hw';render();notify('作业已保存并发布')}function addQuestion(){draft=readEditor();draft.questions.push({type:'choice',prompt:'',options:['','',''],answer:0,points:5});render()}function removeQuestion(i){draft=readEditor();draft.questions.splice(i,1);if(!draft.questions.length)draft.questions.push({type:'choice',prompt:'',options:['','',''],answer:0,points:5});render()}function changeType(i,t){draft=readEditor();draft.questions[i].type=t;draft.questions[i].answer=t==='choice'?0:t==='tf'?'true':'';if(t==='choice')draft.questions[i].options=['','',''];render()}
function materials(){return head('教材/资料','教材与资料','上传课堂资料，管理学生可见内容')+'<section class="card"><label class="btn">＋ 上传资料<input type="file" hidden onchange="addMaterial(event)"></label><div class="list">'+data.materials.map((m,i)=>'<div class="item"><b>'+esc(m)+'</b><button class="btn alt" onclick="removeMaterial('+i+')">删除</button></div>').join('')+'</div><p class="tip">这里保存资料名称；完整课本 PDF 不直接公开上传，学生端使用课程索引。</p></section>'}function addMaterial(e){if(e.target.files[0]){data.materials.unshift(e.target.files[0].name);store();render();notify('资料已添加')}}function removeMaterial(i){if(confirm('确定删除这份资料吗？')){data.materials.splice(i,1);store();render()}}function grades(){return head('成绩统计','班级成绩概览','出勤 30% · 作业 30% · 测验/活动 40%')+'<section class="card"><table class="table"><thead><tr><th>学生</th><th>出勤</th><th>作业</th><th>活动</th><th>总评</th></tr></thead><tbody>'+data.students.map(s=>'<tr><td><b>'+esc(s.name)+'</b></td><td>'+(data.attendance[s.id]?'已签到':'—')+'</td><td>—</td><td>—</td><td>—</td></tr>').join('')+'</tbody></table></section>'}
document.addEventListener('submit',e=>{if(e.target.id==='take')submitAssignment(e);if(e.target.id==='assignmentForm')saveAssignment(e)});render();
</script></body></html>
