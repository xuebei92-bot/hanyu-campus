<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8d2730"><title>Hanyu Campus · 线下国际中文课堂</title><style>
:root{--red:#8d2730;--ink:#292624;--muted:#756f6a;--paper:#fffaf4;--panel:#fffdf9;--line:#eadfd5;--green:#39735d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 10%,#f2dccc 0,transparent 35%),var(--paper)}.auth-card{width:min(100%,460px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:36px;box-shadow:0 16px 45px #52251b0b}.brand{display:flex;align-items:center;gap:10px;color:var(--red);font-size:20px;font-weight:700}.mark{width:34px;height:34px;border-radius:10px;background:var(--red);color:#fffaf4;display:grid;place-items:center}.eyebrow{font-size:12px;color:var(--red);font-weight:700;letter-spacing:.12em;text-transform:uppercase}.h1{font-size:34px;line-height:1.15;margin:8px 0}.sub,.meta{color:var(--muted)}.sub{margin:0 0 20px}.form{display:grid;gap:14px}.form label{display:grid;gap:6px;font-weight:700}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:white}.btn{border:0;border-radius:9px;padding:11px 17px;background:var(--red);color:#fff;font-weight:700}.btn.alt{background:#f1e4d8;color:var(--red)}.tip{font-size:14px;color:var(--muted);border-left:3px solid #b78a54;padding-left:12px}.shell{min-height:100vh;display:flex}.rail{width:240px;background:#f4e8dd;border-right:1px solid var(--line);padding:25px 18px;display:flex;flex-direction:column}.nav{display:grid;gap:5px;margin-top:26px}.nav button{text-align:left;padding:11px 13px;background:transparent;border:0;border-radius:10px;color:#635b55;font-weight:700}.nav button.active,.nav button:hover{background:#fff8f0;color:var(--red)}.user{margin-top:auto;border-top:1px solid var(--line);padding-top:18px;display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#ead0bc;color:var(--red);font-weight:700}.main{flex:1;padding:30px 5%;max-width:1450px}.top{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:25px}.grid{display:grid;gap:18px}.two{grid-template-columns:1.5fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:0 16px 45px #52251b0b}.card h2,.card h3{margin:0 0 12px}.hero{background:var(--red);color:#fff7ef}.hero .sub,.hero .meta{color:#f5d9d3}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#f3e7dd;color:var(--red);font-size:13px;font-weight:700}.hero .pill{background:#ffffff22;color:#fff}.time{font-size:42px;font-weight:700;margin:16px 0 2px}.metric{font-size:30px;font-weight:700}.bar{height:8px;border-radius:8px;background:#eee3da;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);border-radius:8px}.list{display:grid}.item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.item:last-child{border-bottom:0}.status{color:var(--green);font-size:13px;font-weight:700}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}.table th{color:var(--muted);font-weight:500}.code{font-size:56px;letter-spacing:.15em;color:var(--red);font-weight:700;text-align:center;padding:20px;background:#fff3e9;border-radius:12px}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:13px 18px;border-radius:10px}.hide{display:none}@media(max-width:800px){.shell{display:block}.rail{width:100%;padding:12px 14px;display:block;position:sticky;top:0;z-index:2}.rail .brand{padding:3px 4px 10px}.nav{display:flex;overflow:auto;margin-top:0}.nav button{white-space:nowrap;padding:8px 10px;font-size:14px}.user{display:none}.main{padding:22px 16px 70px}.top{margin-bottom:18px}.top .btn{display:none}.h1{font-size:28px}.two,.three{grid-template-columns:1fr}.card{padding:17px}.time{font-size:36px}.auth-card{padding:25px 20px}}
</style></head><body><div id="app"><main class="auth"><section class="auth-card"><div class="brand"><span class="mark">汉</span> Hanyu Campus</div><div class="eyebrow" style="margin-top:25px">In-person Chinese learning</div><h1 class="h1">Welcome back</h1><p class="sub">正在加载课堂平台…</p><p class="tip">如果这个页面停留在这里，说明浏览器没有执行页面脚本。</p></section></main></div><script>
const demo={students:[{id:'anna',name:'Anna Petrova',initial:'A',language:'俄语',att:null},{id:'leo',name:'Leo Martin',initial:'L',language:'法语',att:null},{id:'maria',name:'Maria Santos',initial:'M',language:'西班牙语',att:null}],assignments:[{id:1,title:'我的中文名',kind:'选择题 + 填空',due:'2026-09-18',state:'已发布',n:3}],materials:['HSK 1 · 第三课：你叫什么名字？','课堂词汇音频与练习说明']};let data;try{data=JSON.parse(localStorage.getItem('hanyu-data')||'null')}catch(e){}if(!data||!Array.isArray(data.students))data=demo;let user=null;try{user=JSON.parse(localStorage.getItem('hanyu-user')||'null')}catch(e){}let page='home';
const store=()=>localStorage.setItem('hanyu-data',JSON.stringify(data));const notify=t=>{let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)};const go=p=>{page=p;render()};const logout=()=>{user=null;localStorage.removeItem('hanyu-user');render()};
function render(){if(!user){document.getElementById('app').innerHTML='<main class="auth"><section class="auth-card"><div class="brand"><span class="mark">汉</span> Hanyu Campus</div><div class="eyebrow" style="margin-top:25px">In-person Chinese learning</div><h1 class="h1">Welcome back</h1><p class="sub">Sign in to your in-person class.</p><form id="login" class="form"><label>Username<input id="name" class="field" placeholder="anna or teacher" required></label><label>Password<input id="pass" class="field" type="password" placeholder="hanyu123" required></label><button class="btn">Sign in</button></form><p class="tip" style="margin-top:20px">演示账号：anna / teacher<br>密码：hanyu123</p></section></main>';document.getElementById('login').onsubmit=e=>{e.preventDefault();let n=document.getElementById('name').value.trim().toLowerCase();if(n!=='anna'&&n!=='teacher')return notify('请输入 anna 或 teacher');user={role:n==='teacher'?'teacher':'student',id:n};localStorage.setItem('hanyu-user',JSON.stringify(user));render()};return}document.getElementById('app').innerHTML='<div class="shell">'+sidebar()+'<main class="main">'+(user.role==='student'?student():teacher())+'<p class="meta" style="margin-top:32px">Hanyu Campus <button class="btn alt" style="float:right" onclick="logout()">退出登录</button></p></main></div>'}
function sidebar(){let s=user.role==='student'?[['home','Home'],['book','Textbook'],['hw','Homework'],['practice','Practice'],['grades','Grades / Profile']]:[['home','今日课程'],['students','学生管理'],['hw','作业管理'],['materials','教材/资料'],['activity','课堂活动'],['grades','成绩统计'],['settings','系统设置']];return '<aside class="rail"><div class="brand"><span class="mark">汉</span> Hanyu Campus</div><nav class="nav">'+s.map(x=>'<button class="'+(page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</nav><div class="user">'+avatar(user.role==='student'?'A':'教')+'<span><b>'+(user.role==='student'?'Anna Petrova':'林老师')+'</b><br><small>'+(user.role==='student'?'HSK 1–2':'教师端')+'</small></span></div></aside>'}function avatar(x){return '<span class="avatar">'+x+'</span>'}function head(a,b,c){return '<div class="top"><div><div class="eyebrow">'+a+'</div><h1 class="h1">'+b+'</h1><p class="sub">'+(c||'')+'</p></div></div>'}
function student(){if(page==='book')return book();if(page==='hw')return studentHw();if(page==='practice')return practice();if(page==='grades')return studentGrades();return head('Wednesday · 16 September 2026','Good afternoon, Anna.','Your next in-person class is ready.')+'<div class="grid two"><section class="card hero"><span class="pill">Today’s Class · 第 6 次课</span><div class="time">14:00 — 17:20</div><div class="meta">Room B-204 · Chinese Foundations</div><p>签到开放后，用手机扫描教室投影上的动态二维码。</p><button class="btn alt" onclick="notify(\'请在教师端开始签到后扫描二维码\')">Scan to check in →</button></section><section class="card"><div class="item"><h3>Attendance</h3><span class="status">暂无记录</span></div><div class="metric">—</div><div class="bar"><i style="width:0"></i></div><p class="meta">完成签到后，这里会显示你的实际出勤率。</p><hr style="border:0;border-top:1px solid var(--line)"><h3>Today’s focus</h3><p>Introducing yourself · names · countries</p></section></div><div class="grid three" style="margin-top:18px"><section class="card"><span class="pill">Homework</span><h3>我的中文名</h3><p class="meta">Due Friday · 3 exercises</p><button class="btn alt" onclick="go(\'hw\')">Continue →</button></section><section class="card"><span class="pill">Practice</span><h3>Numbers 1–20</h3><p class="meta">8 min recommended</p><button class="btn alt" onclick="go(\'practice\')">Start →</button></section><section class="card"><span class="pill">Progress</span><h3>Course average</h3><div class="metric">—</div><p class="meta">还没有足够数据</p></section></div>'}
function book(){return head('Textbook · 第三课','你叫什么名字？','Vocabulary, dialogue and grammar for today.')+'<section class="card"><h3>词汇</h3><div class="list">'+[['叫','jiào','to be called'],['什么','shénme','what'],['名字','míngzi','name'],['认识','rènshi','to know / meet']].map(x=>'<div class="item"><b>'+x[0]+' <span class="meta">'+x[1]+'</span></b><span class="meta">'+x[2]+'</span></div>').join('')+'</div></section>'}function studentHw(){return head('Homework','我的中文名','Auto-graded exercises from your teacher.')+'<section class="card"><div class="item"><span><b>我的中文名</b><br><span class="meta">选择题 + 填空 · 3 题 · Due 2026-09-18</span></span><button class="btn" onclick="notify(\'作业已打开\')">开始</button></div></section>'}function practice(){return head('Practice lab','Choose a quick activity','Short activities for in-person practice.')+'<div class="grid three">'+['Quiz · 词汇小测','Word Match · 词语配对','Sentence Order · 句子排序'].map(x=>'<section class="card"><h3>'+x+'</h3><p class="meta">课堂练习</p><button class="btn" onclick="notify(\'活动开始\')">Start →</button></section>').join('')+'</div>'}function studentGrades(){return head('Grades / Profile','Your progress','成绩会根据出勤、作业和课堂活动汇总。')+'<div class="grid two"><section class="card"><h3>Course average</h3><div class="metric">— / 100</div><p class="meta">还没有足够数据</p></section><section class="card"><h3>Your profile</h3><p>'+avatar('A')+'　<b>Anna Petrova</b></p><label class="btn alt">Upload avatar<input type="file" hidden onchange="notify(\'头像已更新\')"></label></section></div>'}
function teacher(){if(page==='students')return students();if(page==='hw')return assignments();if(page==='materials')return materials();if(page==='activity')return head('课堂活动','课堂活动控制','发布活动后，学生端会看到入口。')+'<div class="grid three">'+['Quiz · 自我介绍','Word Match · 国籍','Sentence Order · 句型'].map(x=>'<section class="card"><h3>'+x+'</h3><p class="meta">可计入课堂活动成绩</p><button class="btn" onclick="notify(\'活动已发布\')">发布活动</button></section>').join('')+'</div>';if(page==='grades')return grades();if(page==='settings')return head('系统设置','系统设置','课堂和账号设置')+'<section class="card form"><label>课程名称<input class="field" value="线下国际中文课堂"></label><label>签到刷新间隔<select class="field"><option>15 秒</option><option>10 秒</option></select></label><button class="btn" onclick="notify(\'设置已保存\')">保存设置</button></section>';return head('教师工作台 · 2026年9月16日','今日课程','中文基础 · HSK 1–2 混合班 · B-204')+'<div class="grid two"><section class="card hero"><span class="pill">第 6 次课 · 14:00—17:20</span><h2>自我介绍与国籍</h2><p class="sub">课堂流程：签到 → 词汇导入 → 对话练习 → Quiz</p><button class="btn alt" onclick="startAtt()">开始签到</button></section><section class="card"><h3>签到状态</h3><p class="tip">点击“开始签到”，投影动态二维码，学生登录后扫码。</p><p class="status">今日尚未开始</p><div class="item">已签到 <b>0 / '+data.students.length+'</b><button class="btn alt" onclick="notify(\'请先开始签到\')">手动调整</button></div></section></div>'}
function students(){return head('学生管理','学生名单','HSK 1–2 · 线下中文基础')+'<section class="card"><button class="btn" onclick="addStudent()">＋ 添加学生</button><table class="table"><thead><tr><th>学生</th><th>母语</th><th>出勤</th><th>操作</th></tr></thead><tbody>'+data.students.map(s=>'<tr><td>'+avatar(s.initial)+'　<b>'+s.name+'</b></td><td>'+s.language+'</td><td>暂无记录</td><td><button class="btn alt" onclick="editStudent(\''+s.id+'\')">编辑</button> <button class="btn alt" onclick="removeStudent(\''+s.id+'\')">删除</button></td></tr>').join('')+'</tbody></table></section>'}function assignments(){return head('作业管理','作业管理','创建、编辑并发布自动评分作业')+'<section class="card"><button class="btn" onclick="newAssignment()">＋ 新建作业</button><div class="list">'+data.assignments.map(a=>'<div class="item"><span><b>'+a.title+'</b><br><span class="meta">'+a.kind+' · '+a.n+' 题 · '+a.due+'</span></span><span class="pill">'+a.state+'</span></div>').join('')+'</div></section>'}function materials(){return head('教材/资料','教材与资料','上传课堂资料，管理学生可见内容')+'<section class="card"><label class="btn">＋ 上传资料<input type="file" hidden onchange="addMaterial(event)"></label><div class="list">'+data.materials.map((m,i)=>'<div class="item"><b>'+m+'</b><button class="btn alt" onclick="removeMaterial('+i+')">删除</button></div>').join('')+'</div><p class="tip">公开页面只展示自建课程索引，不上传完整课本 PDF。</p></section>'}function grades(){return head('成绩统计','班级成绩概览','出勤 30% · 作业 30% · 测验/活动 40%')+'<section class="card"><table class="table"><thead><tr><th>学生</th><th>出勤</th><th>作业</th><th>活动</th><th>总评</th></tr></thead><tbody>'+data.students.map(s=>'<tr><td><b>'+s.name+'</b></td><td>—</td><td>—</td><td>—</td><td>—</td></tr>').join('')+'</tbody></table></section>'}
function addStudent(){let n=prompt('学生姓名');if(!n)return;data.students.push({id:'s'+Date.now(),name:n,initial:n[0].toUpperCase(),language:'未填写',att:null});store();render();notify('学生已添加')}function editStudent(id){let s=data.students.find(x=>x.id===id),n=prompt('修改学生姓名',s.name);if(n){s.name=n;store();render()}}function removeStudent(id){if(confirm('确定删除这名学生吗？')){data.students=data.students.filter(x=>x.id!==id);store();render()}}function newAssignment(){let n=prompt('作业标题');if(n){data.assignments.unshift({id:Date.now(),title:n,kind:'选择题 / 判断题 / 填空题',due:'2026-09-24',state:'草稿',n:5});store();render();notify('作业已创建')}}function addMaterial(e){if(e.target.files[0]){data.materials.unshift(e.target.files[0].name);store();render();notify('资料已上传')}}function removeMaterial(i){if(confirm('确定删除这份资料吗？')){data.materials.splice(i,1);store();render()}}function startAtt(){notify('动态签到已开始：每 15 秒刷新一次，开放 5 分钟')}render();
</script></body></html>
